name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every gate runs even when an earlier one fails, so a single run surfaces
      # every problem rather than one problem at a time.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Core purity (source)
        if: ${{ !cancelled() }}
        run: pnpm core-purity

      - name: Token contrast
        if: ${{ !cancelled() }}
        run: pnpm contrast

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Build packages
        if: ${{ !cancelled() }}
        run: pnpm build

      # Re-run against dist: the source check cannot see what the bundler
      # inlined, and this invariant is the whole thesis.
      - name: Core purity (dist)
        if: ${{ !cancelled() }}
        run: pnpm core-purity

      - name: Package lint
        if: ${{ !cancelled() }}
        run: pnpm package-lint

      # Bundles every component entry from dist and asserts none of them pulls
      # in another component. `"sideEffects": false` is a claim; this measures
      # whether it holds. Must run after the build — it reads dist, not src.
      - name: Bundle size and tree-shaking
        if: ${{ !cancelled() }}
        run: pnpm bundle-size

      - name: Build docs site
        if: ${{ !cancelled() }}
        run: pnpm --filter docs build

      # jsdom loads no stylesheet and its focus model is not trustworthy, so
      # this is the only place target size, the thumb's travel, real focus
      # order and constraint validation can actually be checked. See docs/04.
      - name: Cache Playwright browsers
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: ${{ !cancelled() }}
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: End-to-end and axe
        if: ${{ !cancelled() }}
        run: pnpm --filter docs test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: docs/playwright-report/
          retention-days: 7
